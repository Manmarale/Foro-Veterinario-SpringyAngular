<div class="container py-5">
  <div class="contenerdor-titulo-home mb-4">
    <h1 class="fw-bold bungee-title">
      {{ editMode ? 'Editar Mascota' : 'Nueva Mascota' }}
    </h1>
  </div>

  <mat-card class="p-4">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="row">

        <!-- Nombre -->
        <div class="col-md-6 mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="nombre" placeholder="Nombre de la mascota">
            <mat-error *ngIf="form.get('nombre')?.hasError('required')">El nombre es obligatorio</mat-error>
          </mat-form-field>
        </div>

        <!-- Especie -->
        <div class="col-md-6 mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Especie</mat-label>
            <mat-select formControlName="especie">
              <mat-option *ngFor="let esp of especies" [value]="esp">{{ esp }}</mat-option>
            </mat-select>
            <mat-error *ngIf="form.get('especie')?.hasError('required')">La especie es obligatoria</mat-error>
          </mat-form-field>
        </div>

        <!-- Raza -->
        <div class="col-md-6 mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Raza</mat-label>
            <input matInput formControlName="raza" placeholder="Ej: Labrador, Siamés...">
          </mat-form-field>
        </div>

        <!-- Sexo -->
        <div class="col-md-6 mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Sexo</mat-label>
            <mat-select formControlName="sexo">
              <mat-option *ngFor="let s of sexos" [value]="s">{{ s }}</mat-option>
            </mat-select>
            <mat-error *ngIf="form.get('sexo')?.hasError('required')">El sexo es obligatorio</mat-error>
          </mat-form-field>
        </div>

        <!-- Fecha de nacimiento -->
        <div class="col-md-6 mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Fecha de nacimiento</mat-label>
            <input matInput type="date" formControlName="fechaNacimiento">
          </mat-form-field>
        </div>

        <!-- Peso -->
        <div class="col-md-6 mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Peso (kg)</mat-label>
            <input matInput type="number" formControlName="pesoKg" step="0.1" min="0">
          </mat-form-field>
        </div>

        <!-- Observaciones -->
        <div class="col-12 mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Observaciones</mat-label>
            <textarea matInput formControlName="observaciones" rows="3"
                      placeholder="Alergias, condiciones especiales, etc."></textarea>
          </mat-form-field>
        </div>

        <!-- Foto -->
        <div class="col-12 mb-3">
          <label class="form-label fw-bold">Foto de la mascota (opcional)</label>
          <input type="file" class="form-control" (change)="onFileSelected($event)" accept="image/*">
        </div>

      </div>

      <div class="text-end mt-3">
        <button mat-stroked-button type="button" routerLink="/mascotas" class="me-2">Cancelar</button>
        <button mat-raised-button class="custom-button" type="submit" [disabled]="form.invalid">
          {{ editMode ? 'Guardar Cambios' : 'Registrar Mascota' }}
        </button>
      </div>
    </form>
  </mat-card>
</div>
